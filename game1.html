<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <title>カウントアップゲーム</title>
</head>

<body>

    <h1>現在の数字</h1>

    <h2 id="number">読込中...</h2>

    <div>
        <label for="name">名前</label>
        <input id="name">
    </div>

    <br>

    <div>
        <label for="next">次の数字</label>
        <input id="next" type="number">
    </div>

    <br>

    <button id="send">
        送信
    </button>

    <p id="message"></p>

    <script type="module">

        import { initializeApp }
            from "https://www.gstatic.com/firebasejs/12.0.0/firebase-app.js";

        import {
            getFirestore,
            doc,
            onSnapshot,
            runTransaction
        }
            from "https://www.gstatic.com/firebasejs/12.0.0/firebase-firestore.js";

        const firebaseConfig = {

            apiKey: "AIzaSyAB4u16RPa3VCYhu1ZNeC-H9fuv7sRY0uI",
            authDomain: "mito-be388.firebaseapp.com",
            projectId: "mito-be388",
            storageBucket: "mito-be388.firebasestorage.app",
            messagingSenderId: "959045440758",
            appId: "1:959045440758:web:b35177b5942371376a08d7",
            measurementId: "G-GZF5M958CF"

        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const gameRef = doc(db, "game", "state");

        onSnapshot(gameRef, (snapshot) => {

            if (!snapshot.exists()) {
                document.getElementById("message").textContent =
                    "game/state が存在しません";
                return;
            }

            const data = snapshot.data();

            document.getElementById("number").textContent =
                data.currentNumber;

        });

        document.getElementById("send")
            .addEventListener("click", async () => {

                const name =
                    document.getElementById("name").value.trim();

                const next =
                    Number(document.getElementById("next").value);

                if (!name) {
                    alert("名前を入力してください");
                    return;
                }

                try {

                    await runTransaction(
                        db,
                        async (transaction) => {

                            const snap =
                                await transaction.get(gameRef);

                            const current =
                                snap.data().currentNumber;

                            if (next !== current + 1) {
                                throw new Error(
                                    "次の数字ではありません"
                                );
                            }

                            transaction.update(
                                gameRef,
                                {
                                    currentNumber: next,
                                    lastUser: name
                                }
                            );
                        }
                    );

                    document.getElementById("message")
                        .textContent =
                        "登録成功";

                }
                catch (err) {

                    document.getElementById("message")
                        .textContent =
                        "登録失敗 : " + err.message;

                }

            });

    </script>

</body>

</html>
